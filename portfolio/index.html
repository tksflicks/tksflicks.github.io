<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.typekit.net/uiq0inf.css">
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="./index.css">
    <script src="../media/web/photos.js" defer></script>

    <title>Portfolio | TK Flicks</title>
    <!-- Chrome/Edge: start loading a page as soon as its link is hovered/touched, so navigation is instant -->
    <script type="speculationrules">
    { "prerender": [{ "where": { "href_matches": "/*" }, "eagerness": "moderate" }] }
    </script>
</head>

<body>
    <div class="nav_bar">
        
        <div class="nav_wrap_logo"> 
            <a href="../">
                <img id="logo" src="../media/logo/tks_flicks_logo.svg" alt="">
            </a>
        </div>
        <div class="nav_wrap">
            <nav class="main_nav_list">
                <div class="header_nav_list"><a href="../about">ABOUT</a></div>

                <div class="header_nav_list"><a href="./">PORTFOLIO</a></div>
                <div class="header_nav_list"><a href="../contact">CONTACT</a></div>
            </nav>
        </div>
        <div class="nav_socials">
            <div class="header_nav_element">
                <a href="https://www.instagram.com/tksflicks?igsh=MTI3N3B1MGw2ZnNjeg==" target="_blank" rel="noopener noreferrer">
                    <img id="insta" src="../media/logo/instagram-logo.svg" alt="">
                </a>
                <input type="checkbox" id="menu_toggle">
        
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <main class="section portfolio">
        <header class="portfolio-header">
            <h1 class="portfolio-eyebrow">Portfolio</h1>
        </header>

        <div class="portfolio-cards">
            <a class="portfolio-card" href="../gallery/?folder=portrait" data-folder="portrait">
                <span class="portfolio-card-img">
                    <img src="../media/web/portrait/band_photos/IMG_4802-1200.jpg" srcset="../media/web/portrait/band_photos/IMG_4802-600.jpg 600w, ../media/web/portrait/band_photos/IMG_4802-1200.jpg 1200w, ../media/web/portrait/band_photos/IMG_4802-2000.jpg 2000w" sizes="(max-width: 650px) 100vw, 50vw" width="2000" height="3000" alt="">
                </span>
                <span class="portfolio-card-text">
                    <span>
                        <span class="portfolio-card-title">Portraits</span>
                        <span class="portfolio-card-count"></span>
                    </span>
                    <span class="portfolio-card-cta">Explore &rarr;</span>
                </span>
            </a>
            <a class="portfolio-card" href="../gallery/?folder=landscape" data-folder="landscape">
                <span class="portfolio-card-img">
                    <img src="../media/web/landscape/iceland/one-1200.jpg" srcset="../media/web/landscape/iceland/one-600.jpg 600w, ../media/web/landscape/iceland/one-1200.jpg 1200w, ../media/web/landscape/iceland/one-2000.jpg 2000w" sizes="(max-width: 650px) 100vw, 50vw" width="3984" height="2381" alt="">
                </span>
                <span class="portfolio-card-text">
                    <span>
                        <span class="portfolio-card-title">Landscapes</span>
                        <span class="portfolio-card-count"></span>
                    </span>
                    <span class="portfolio-card-cta">Explore &rarr;</span>
                </span>
            </a>
        </div>
    </main>

    <script>
        // "5 albums · 288 photos" under each card, counted from media/web/photos.js
        document.addEventListener('DOMContentLoaded', function() {
            var photos = Object.keys(window.PHOTOS || {});
            document.querySelectorAll('.portfolio-card').forEach(function(card) {
                var prefix = card.dataset.folder + '/';
                var inFolder = photos.filter(function(rel) { return rel.indexOf(prefix) === 0; });
                var albums = {};
                inFolder.forEach(function(rel) {
                    var rest = rel.slice(prefix.length);
                    if (rest.indexOf('/') !== -1) albums[rest.split('/')[0]] = true;
                });
                var n = Object.keys(albums).length;
                if (!inFolder.length) return;
                card.querySelector('.portfolio-card-count').textContent =
                    n + (n === 1 ? ' album' : ' albums') + ' · ' + inFolder.length + ' photos';
            });
        });
    </script>
</body>
<footer>
    <h4>© 2026 Taekyung Kim All rights reserved</h4>
</footer>
</html>
